<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Manage student records in a searchable dashboard.">
	<title>Student Records</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #25302d;
			--muted: #697671;
			--paper: #f4f6f1;
			--white: #ffffff;
			--line: #dce2dc;
			--green: #24634f;
			--green-dark: #194b3b;
			--orange: #d96e48;
			--soft-green: #e9f2ec;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			font-synthesis: none;
		}

		* { box-sizing: border-box; }
		body { margin: 0; background: var(--paper); color: var(--ink); }
		button, input, select { font: inherit; }
		button { cursor: pointer; }
		.page { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 76px;
			border-bottom: 1px solid var(--line);
		}
		.brand { color: var(--green-dark); font-size: 1rem; font-weight: 800; }
		.brand span { color: var(--orange); }
		.top-note { color: var(--muted); font-size: .84rem; }

		main { padding: 38px 0 60px; }
		.page-heading {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 24px;
			margin-bottom: 28px;
		}
		.eyebrow { margin: 0 0 8px; color: var(--green); font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
		h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 500; }
		.summary { min-width: 140px; padding-left: 18px; border-left: 2px solid var(--orange); }
		.summary strong { display: block; font-size: 1.45rem; }
		.summary span { color: var(--muted); font-size: .8rem; }

		.workspace { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
		.panel { border: 1px solid var(--line); border-radius: 5px; background: var(--white); }
		.form-panel { padding: 22px; }
		.panel-heading { margin: 0 0 4px; font-size: 1.08rem; }
		.panel-hint { margin: 0 0 20px; color: var(--muted); font-size: .83rem; }
		.field { margin-top: 15px; }
		label { display: block; margin-bottom: 6px; font-size: .82rem; font-weight: 700; }
		input, select {
			width: 100%;
			min-height: 42px;
			padding: 9px 11px;
			border: 1px solid #c8d1cb;
			border-radius: 3px;
			background: #fff;
			color: var(--ink);
		}
		input:focus, select:focus { outline: 3px solid #24634f24; border-color: var(--green); }
		.form-actions { display: flex; gap: 8px; margin-top: 20px; }
		.button {
			min-height: 42px;
			padding: 0 13px;
			border: 1px solid var(--green);
			border-radius: 3px;
			background: var(--green);
			color: #fff;
			font-size: .86rem;
			font-weight: 700;
		}
		.button:hover { background: var(--green-dark); }
		.button-secondary { border-color: var(--line); background: #fff; color: var(--ink); }
		.button-secondary:hover { background: var(--paper); }
		.form-actions .button { flex: 1; }
		.notice { min-height: 20px; margin: 12px 0 0; color: var(--green); font-size: .8rem; }

		.records { min-width: 0; }
		.toolbar {
			display: grid;
			grid-template-columns: minmax(200px, 1fr) minmax(140px, 190px) minmax(140px, 190px);
			gap: 10px;
			margin-bottom: 12px;
		}
		.toolbar input, .toolbar select { min-height: 44px; background-color: #fff; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		thead { background: #eef2ed; }
		th { padding: 12px 14px; color: #52625a; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
		td { padding: 14px; border-top: 1px solid #e8ece8; font-size: .88rem; vertical-align: middle; }
		tbody tr:hover { background: #fbfcfa; }
		.student-name { display: block; font-weight: 700; }
		.student-email { display: block; margin-top: 3px; color: var(--muted); font-size: .79rem; }
		.status { display: inline-block; padding: 4px 8px; border-radius: 2px; background: var(--soft-green); color: var(--green-dark); font-size: .76rem; font-weight: 700; }
		.status-graduated { background: #f7eee5; color: #8a5238; }
		.row-actions { display: flex; gap: 7px; }
		.action-button { padding: 5px 7px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); font-size: .78rem; }
		.action-button:hover { border-color: var(--green); color: var(--green-dark); }
		.delete-button:hover { border-color: #d6a79a; color: #a33f2b; }
		.empty-cell { padding: 44px 20px; color: var(--muted); text-align: center; }
		.table-footer { padding: 11px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
		footer { padding: 18px 0 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }

		@media (max-width: 800px) {
			.workspace { grid-template-columns: 1fr; }
			.form-panel { max-width: none; }
		}
		@media (max-width: 560px) {
			.page { width: calc(100% - 28px); }
			.top-note { display: none; }
			.page-heading { align-items: start; flex-direction: column; }
			.summary { padding-left: 12px; }
			.toolbar { grid-template-columns: 1fr 1fr; }
			.toolbar input { grid-column: 1 / -1; }
			th, td { padding: 10px; }
		}
	</style>
</head>
<body>
	<header class="topbar page">
		<div class="brand">CAMPUS<span>.</span> / RECORDS</div>
		<div class="top-note">Student management</div>
	</header>

	<main class="page">
		<div class="page-heading">
			<div>
				<p class="eyebrow">Administration</p>
				<h1>Student records</h1>
			</div>
			<div class="summary"><strong id="student-count">0</strong><span>Students in records</span></div>
		</div>

		<div class="workspace">
			<form class="panel form-panel" id="student-form">
				<h2 class="panel-heading" id="form-title">Add student</h2>
				<p class="panel-hint">Enter the student's details below.</p>

				<div class="field">
					<label for="student-name">Full name</label>
					<input id="student-name" name="name" type="text" autocomplete="name" required maxlength="80" placeholder="e.g. Asha Patel">
				</div>
				<div class="field">
					<label for="student-email">Email address</label>
					<input id="student-email" name="email" type="email" autocomplete="email" required maxlength="120" placeholder="name@example.com">
				</div>
				<div class="field">
					<label for="student-course">Course</label>
					<input id="student-course" name="course" type="text" required maxlength="80" placeholder="e.g. Computer Science">
				</div>
				<div class="field">
					<label for="student-year">Year</label>
					<select id="student-year" name="year" required>
						<option value="">Choose year</option>
						<option>1st Year</option>
						<option>2nd Year</option>
						<option>3rd Year</option>
						<option>4th Year</option>
						<option>5th Year</option>
					</select>
				</div>
				<div class="field">
					<label for="student-status">Status</label>
					<select id="student-status" name="status" required>
						<option>Active</option>
						<option>Graduated</option>
					</select>
				</div>
				<div class="form-actions">
					<button class="button" id="save-button" type="submit">Add student</button>
					<button class="button button-secondary" id="cancel-edit" type="button" hidden>Cancel</button>
				</div>
				<p class="notice" id="form-notice" role="status" aria-live="polite"></p>
			</form>

			<section class="records" aria-label="Student records">
				<div class="toolbar">
					<input id="search" type="search" placeholder="Search name, email, or course" aria-label="Search student records">
					<select id="course-filter" aria-label="Filter by course">
						<option value="">All courses</option>
					</select>
					<select id="status-filter" aria-label="Filter by status">
						<option value="">All statuses</option>
						<option>Active</option>
						<option>Graduated</option>
					</select>
				</div>

				<div class="panel table-wrap">
					<table>
						<thead>
							<tr>
								<th scope="col">Student</th>
								<th scope="col">Course</th>
								<th scope="col">Year</th>
								<th scope="col">Status</th>
								<th scope="col">Actions</th>
							</tr>
						</thead>
						<tbody id="student-rows"></tbody>
					</table>
					<div class="table-footer" id="results-count">Showing 0 students</div>
				</div>
			</section>
		</div>
	</main>

	<footer><div class="page">Student data is stored in this browser on this device.</div></footer>

	<script>
		const storageKey = "student-dashboard-records";
		const form = document.getElementById("student-form");
		const rows = document.getElementById("student-rows");
		const notice = document.getElementById("form-notice");
		let students = loadStudents();
		let editingId = null;

		function loadStudents() {
			try {
				const savedStudents = JSON.parse(localStorage.getItem(storageKey) || "[]");
				return Array.isArray(savedStudents) ? savedStudents : [];
			} catch {
				return [];
			}
		}

		function saveStudents() {
			try {
				localStorage.setItem(storageKey, JSON.stringify(students));
				return true;
			} catch {
				return false;
			}
		}

		function makeCell(text) {
			const cell = document.createElement("td");
			cell.textContent = text;
			return cell;
		}

		function renderStudents() {
			const searchText = document.getElementById("search").value.trim().toLowerCase();
			const courseFilter = document.getElementById("course-filter").value;
			const statusFilter = document.getElementById("status-filter").value;
			const filteredStudents = students.filter(student => {
				const searchableText = `${student.name} ${student.email} ${student.course}`.toLowerCase();
				return searchableText.includes(searchText)
					&& (!courseFilter || student.course === courseFilter)
					&& (!statusFilter || student.status === statusFilter);
			});

			rows.replaceChildren();
			document.getElementById("student-count").textContent = students.length;
			document.getElementById("results-count").textContent = `Showing ${filteredStudents.length} of ${students.length} students`;

			if (filteredStudents.length === 0) {
				const emptyRow = document.createElement("tr");
				const emptyCell = document.createElement("td");
				emptyCell.className = "empty-cell";
				emptyCell.colSpan = 5;
				emptyCell.textContent = students.length ? "No students match your search or filters." : "No student records yet. Add a student to get started.";
				emptyRow.append(emptyCell);
				rows.append(emptyRow);
			}

			filteredStudents.forEach(student => {
				const row = document.createElement("tr");
				const studentCell = document.createElement("td");
				const name = document.createElement("span");
				name.className = "student-name";
				name.textContent = student.name;
				const email = document.createElement("span");
				email.className = "student-email";
				email.textContent = student.email;
				studentCell.append(name, email);
				row.append(studentCell, makeCell(student.course), makeCell(student.year));

				const statusCell = document.createElement("td");
				const status = document.createElement("span");
				status.className = student.status === "Graduated" ? "status status-graduated" : "status";
				status.textContent = student.status;
				statusCell.append(status);
				row.append(statusCell);

				const actionsCell = document.createElement("td");
				const actions = document.createElement("div");
				actions.className = "row-actions";
				const editButton = document.createElement("button");
				editButton.className = "action-button";
				editButton.type = "button";
				editButton.dataset.action = "edit";
				editButton.dataset.id = student.id;
				editButton.textContent = "Edit";
				editButton.setAttribute("aria-label", `Edit ${student.name}`);
				const deleteButton = document.createElement("button");
				deleteButton.className = "action-button delete-button";
				deleteButton.type = "button";
				deleteButton.dataset.action = "delete";
				deleteButton.dataset.id = student.id;
				deleteButton.textContent = "Delete";
				deleteButton.setAttribute("aria-label", `Delete ${student.name}`);
				actions.append(editButton, deleteButton);
				actionsCell.append(actions);
				row.append(actionsCell);
				rows.append(row);
			});

			renderCourseFilter();
		}

		function renderCourseFilter() {
			const filter = document.getElementById("course-filter");
			const selectedCourse = filter.value;
			const courses = [...new Set(students.map(student => student.course))].sort((a, b) => a.localeCompare(b));
			filter.replaceChildren(new Option("All courses", ""));
			courses.forEach(course => filter.add(new Option(course, course)));
			filter.value = courses.includes(selectedCourse) ? selectedCourse : "";
		}

		function resetForm() {
			form.reset();
			editingId = null;
			document.getElementById("form-title").textContent = "Add student";
			document.getElementById("save-button").textContent = "Add student";
			document.getElementById("cancel-edit").hidden = true;
			notice.textContent = "";
		}

		form.addEventListener("submit", event => {
			event.preventDefault();
			const formData = new FormData(form);
			const studentDetails = {
				name: formData.get("name").trim(),
				email: formData.get("email").trim(),
				course: formData.get("course").trim(),
				year: formData.get("year"),
				status: formData.get("status")
			};

			if (editingId) {
				students = students.map(student => student.id === editingId ? { ...student, ...studentDetails } : student);
				notice.textContent = saveStudents() ? "Student details updated." : "Updated for this session, but browser storage is unavailable.";
			} else {
				students.unshift({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, ...studentDetails });
				notice.textContent = saveStudents() ? "Student added." : "Added for this session, but browser storage is unavailable.";
			}

			editingId = null;
			form.reset();
			document.getElementById("form-title").textContent = "Add student";
			document.getElementById("save-button").textContent = "Add student";
			document.getElementById("cancel-edit").hidden = true;
			renderStudents();
		});

		rows.addEventListener("click", event => {
			const button = event.target.closest("button[data-action]");
			if (!button) return;

			const student = students.find(item => item.id === button.dataset.id);
			if (!student) return;

			if (button.dataset.action === "edit") {
				editingId = student.id;
				document.getElementById("student-name").value = student.name;
				document.getElementById("student-email").value = student.email;
				document.getElementById("student-course").value = student.course;
				document.getElementById("student-year").value = student.year;
				document.getElementById("student-status").value = student.status;
				document.getElementById("form-title").textContent = "Edit student";
				document.getElementById("save-button").textContent = "Save changes";
				document.getElementById("cancel-edit").hidden = false;
				notice.textContent = `Editing ${student.name}.`;
				document.getElementById("student-name").focus();
				return;
			}

			students = students.filter(item => item.id !== student.id);
			if (editingId === student.id) resetForm();
			notice.textContent = saveStudents() ? `${student.name} was deleted.` : "Deleted for this session, but browser storage is unavailable.";
			renderStudents();
		});

		document.getElementById("cancel-edit").addEventListener("click", resetForm);
		document.getElementById("search").addEventListener("input", renderStudents);
		document.getElementById("course-filter").addEventListener("change", renderStudents);
		document.getElementById("status-filter").addEventListener("change", renderStudents);

		renderStudents();
	</script>
</body>
</html>
